# kntx example configuration
# copy to config.toml and edit for your environment

[forwarding]
# forwarding strategy: "userspace" (default), "vectored", or "splice" (linux-only, zero-copy)
strategy = "userspace"
# socket_buffer_size = 262144

[logging]
level = "info"

# serves /metrics (prometheus), /healthz (liveness) and /ready (readiness).
# omitting this section binds nothing; collection still runs.
[metrics]
address = "0.0.0.0:9090"

# global health check defaults - each [[pools]] entry can override these
[health]
# check_interval_secs = 10   # active TCP probes (omit to disable globally)
failure_threshold = 3         # consecutive failures before circuit opens
recovery_timeout_secs = 10    # seconds in Open state before half-open probe

# access log - one structured line per completed request.
# default output is stdout, JSON format. uncomment to send elsewhere.
# [access_log]
# output = { file = "/var/log/kntx/access.log" }
# file_channel_capacity = 4096   # backpressure buffer for the file writer

# timeout reference (three distinct "idle" knobs at different scopes):
#
#   listener.idle_timeout_secs           - fallback for the four phase
#                                          timeouts below; legacy single-watchdog
#                                          knob, kept for compatibility.
#   listener.keepalive_idle_timeout_secs - max wait BETWEEN requests on a
#                                          kept-alive client connection.
#   pools.keepalive.idle_conn_ttl_secs   - how long an idle backend conn
#                                          stays in the cache before the
#                                          sweeper drops it.
#
# none of these overlap. set them per their scope.

# -------- listeners --------
# each listener binds one address and routes to a named pool.
# a listener uses EITHER `pool` (single pool) OR `[[listeners.routes]]` (routing table) - not both.

[[listeners]]
address = "0.0.0.0:8080"
mode = "l4"
pool = "web"
# max_connections = 10000
# idle_timeout_secs = 300
# drain_timeout_secs = 30
# connect_timeout_secs = 5
# max_connect_attempts = 3

# PROXY protocol (any mode). Behind an L4 balancer - an AWS NLB, an ELB in TCP
# mode, another HAProxy - the TCP peer is the balancer, so X-Forwarded-For, the
# access log and per-IP rate limiting would all key on it. Turn this on and the
# real client address is read from the header the balancer prepends.
#
# Once on, the header is REQUIRED. Taking either a header or a bare connection on
# one port would let any client claim any source address, so there is no mixed
# mode; give the balancer its own listener if plain clients also need one.
#
# proxy_protocol = true
#
# Peers allowed to send it, as an address or address/prefix. Empty (the default)
# trusts anything that can reach the listener, which assumes the port is only
# reachable from the balancer - the same assumption HAProxy's accept-proxy makes.
# Set it when the port is reachable more widely than that.
#
# proxy_protocol_from = ["10.0.0.0/8", "172.31.0.0/16"]
#
# One caveat with `rate_limit` below: on a proxy_protocol listener the zone check
# happens after the header is read rather than at accept, because the address to
# key on does not exist before then. A denied connection has therefore already
# taken a max_connections slot, so max_connections rather than the zone is what
# bounds a flood on this listener.

# TLS listener - dotted keys + inline cert array keeps everything in one block.
# uncomment a `tls.certificates = [...]` line below to enable.
[[listeners]]
address = "0.0.0.0:8443"
mode = "l4"
pool = "api"
tls.handshake_timeout_secs = 5
tls.min_version = "1.2"   # "1.2" (default) or "1.3"

# single certificate:
# tls.certificates = [{ cert = "/path/to/fullchain.pem", key = "/path/to/privkey.pem" }]

# multiple certificates (SNI selection) - inline array spans lines, each entry stays one line:
# tls.certificates = [
#   { cert = "/path/api/fullchain.pem",   key = "/path/api/privkey.pem",   sni_names = ["api.example.com"] },
#   { cert = "/path/admin/fullchain.pem", key = "/path/admin/privkey.pem", sni_names = ["admin.example.com"] },
#   { cert = "/path/wildcard/fullchain.pem", key = "/path/wildcard/privkey.pem", sni_names = ["*.example.com"] },
# ]

# L7 listener with HTTP parsing, host/path routing, and the full keep-alive surface.
# routes are evaluated in declaration order - first match wins.
# there is no longest-match or specificity reordering; put more specific rules first.
#
# [[listeners]]
# address = "0.0.0.0:80"
# mode = "l7"
#
# request lifecycle caps (all optional; sensible defaults apply if omitted)
#
# client_header_timeout_secs = 60   # per-call read gap while receiving the request head
# client_body_timeout_secs   = 60   # per-call read gap while receiving the request body
# proxy_send_timeout_secs    = 60   # per-call write gap forwarding to the backend
# proxy_read_timeout_secs    = 60   # per-call read gap reading the backend response
# request_timeout_secs       = 60   # total deadline from head start to response complete
# max_body_size_bytes        = 1048576   # 1 MiB; 0 = unlimited (no body cap enforced)
# header_size_limit_bytes    = 16384     # header section size cap
#
# client-side keep-alive (HTTP/1.1 default-on, HTTP/1.0 opt-in via Connection: keep-alive)
#
# keepalive_idle_timeout_secs = 60       # max wait between requests on a kept-alive client conn
# keepalive_max_requests      = 1000     # close conn after this many sequential requests
#
# route api.example.com to the api pool
# [[listeners.routes]]
# host = "api.example.com"
# pool = "api"
#
# wildcard: *.example.com matches api.example.com AND a.b.example.com, but NOT example.com
# [[listeners.routes]]
# host = "*.example.com"
# pool = "web"
#
# path prefix: /admin/* must come BEFORE /  (or it will never be reached)
# [[listeners.routes]]
# path_prefix = "/admin"
# pool = "admin"
#
# catch-all: last route with no matchers handles everything else
# [[listeners.routes]]
# pool = "web"

# TLS passthrough listener - routes on the ClientHello SNI, then forwards raw
# encrypted bytes. the client handshakes with the backend's certificate; kntx
# never terminates TLS (mutually exclusive with a `tls` section). because the
# bytes stay opaque, splice zero-copy works on these connections.
# routes may only use `sni` - host/path/method need HTTP, which is encrypted here.
#
# [[listeners]]
# address = "0.0.0.0:8443"
# mode = "tls-passthrough"
#
# clienthello_timeout_secs = 10   # max time to receive the full ClientHello
#                                 # (slowloris bound, like nginx preread_timeout)
#
# [[listeners.routes]]
# sni = "api.example.com"
# pool = "api"
#
# wildcard SNI works like wildcard host
# [[listeners.routes]]
# sni = "*.example.com"
# pool = "web"
#
# catch-all: also receives ClientHellos without SNI.
# without a catch-all, no-SNI connections are closed (no route matches).
# [[listeners.routes]]
# pool = "web"

# -------- pools --------
# each pool is one block: name, optional health override, backends list, optional keepalive cache config.
#
# strategy picks how a backend is chosen per connection (l4/passthrough) or per
# request (l7). unhealthy backends are skipped by every strategy.
#
#   "round_robin" (default) - even rotation. right answer unless measurements say otherwise.
#   "least_conn"            - fewest in-flight wins, ties rotate. suits long-lived
#                             L4 connections and uneven per-request cost, where
#                             plain rotation lets one backend accumulate work.
#   "weighted"              - each backend gets a share of traffic proportional to
#                             its `weight`. for uneven backend capacity, canary
#                             rollouts, and draining.
#
# strategy is restart-only. a reload logs a WARN and keeps the running strategy;
# per-backend `weight` IS live, which is what makes draining work without a restart.

[[pools]]
name = "web"
backends = [
  { address = "127.0.0.1:3001" },
  { address = "127.0.0.1:3002" },
]
# keepalive cache uses defaults: max_idle=32, idle_conn_ttl_secs=60, max_total=0 (unlimited).
# strategy defaults to round_robin; weight defaults to 1 and is ignored unless weighted.

# weighted pool: 3001 takes 3/4 of traffic, 3002 takes 1/4.
# set a weight to 0 to drain that backend - it stops receiving new traffic while
# in-flight work finishes, and SIGHUP applies it without a restart. it is also
# excluded from failover, since a drained backend is drained on purpose.
# at least one backend must have a nonzero weight.
#
# [[pools]]
# name = "canary"
# strategy = "weighted"
# backends = [
#   { address = "127.0.0.1:3001", weight = 3 },
#   { address = "127.0.0.1:3002", weight = 1 },
# ]

# [[pools]]
# name = "streams"
# strategy = "least_conn"
# backends = [
#   { address = "127.0.0.1:5001" },
#   { address = "127.0.0.1:5002" },
# ]

[[pools]]
name = "api"
# per-pool health override (merges with [health] defaults above)
health = { check_interval_secs = 5, failure_threshold = 2 }
backends = [
  { address = "127.0.0.1:4001" },
  { address = "127.0.0.1:4002" },
]
# backend keep-alive cache. each backend in the pool gets its own cache;
# the same backend address listed in two pools has two independent caches.
[pools.keepalive]
max_idle          = 32     # idle conns held per backend; 0 disables the cache entirely
idle_conn_ttl_secs = 60    # idle conn dropped from the cache after this many seconds
max_total          = 0     # cap on total conns (active + idle) per backend; 0 = unlimited

# -------- rate limiting --------
# named zones, each one limiter with one budget shape. attach a zone by name
# to a listener (any mode, checked per connection at accept, denied conns are
# reset) or to an L7 route (checked per request after routing, denied requests
# get 429 + Retry-After). every site naming the same zone shares its budget.
#
# [rate_limit.zones.per_ip]
# key = "client_ip"    # one budget per client IP; "global" = one shared budget
# rate = 100           # admitted events per period, sustained
# per = "s"            # "s" (default) or "m"
# burst = 20           # extra events admitted back to back; 0 = strict pacing
# max_keys = 65536     # client_ip zones only: state capacity (~1 MiB at the
#                      # default; rounds up to a power-of-two set count).
#                      # excess keys evict the least recently admitted key in
#                      # their cache set, memory never grows.
#
# [rate_limit.zones.api_global]
# key = "global"
# rate = 500
# per = "s"
#
# per-listener attachment (protects the accept path):
# [[listeners]]
# address = "0.0.0.0:8080"
# pool = "web"
# rate_limit = "per_ip"
#
# per-route attachment (l7 listeners only; protects a specific route):
# [[listeners.routes]]
# path_prefix = "/login"
# pool = "api"
# rate_limit = "per_ip"
