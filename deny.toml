[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # archived Aug 2025, no CVE - rustls-pki-types now ships the same PEM parsing
    # code directly via the PemObject trait. Migration is real work on a
    # security-sensitive path (cert/key loading); not worth it for an unmaintained
    # notice with no actual vulnerability behind it.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained, not vulnerable - migration deferred, no active exploit" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
